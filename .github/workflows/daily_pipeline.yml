name: Daily ETL Pipeline

# Runs automatically every day at 03:00 UTC (08:30 IST), and can also be
# triggered manually from the Actions tab for testing.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extract step
        run: python scripts/extract.py
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Run transform step
        run: python scripts/transform.py

      - name: Run load step
        run: python scripts/load.py

      - name: Commit updated database back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline.db data/processed_orders.csv
          git diff --staged --quiet || git commit -m "Automated daily data refresh"
          git push
